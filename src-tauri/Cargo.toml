[package]
name = "kiwanto"
version = "0.1.0"
description = "Kiwanto desktop application"
authors = ["Kiwanto"]
edition = "2021"

[lib]
name = "kiwanto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
